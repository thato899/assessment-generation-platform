<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480"><title>Vertical projectile motion diagram: upward-elevated</title><desc>Deterministic one-dimensional vertical motion schematic</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#174a7e"/></marker></defs><g id="diagram" font-family="sans-serif" font-size="14"><line id="ground" x1="60" y1="435.000" x2="570" y2="435.000" stroke="#333" stroke-width="2"/><text id="ground-label" x="580" y="440.000">ground / reference</text><line id="axis" x1="150.000" y1="50" x2="150.000" y2="435" stroke="#777" stroke-width="2"/><line id="motion-line" x1="150.000" y1="50.000" x2="150.000" y2="435.000" stroke="#8aa" stroke-dasharray="4 4"/><circle id="launch-point" cx="150.000" cy="358.000" r="7" fill="#174a7e"/><text id="launch-label" x="168.000" y="348.000">launch</text><circle id="event-launch" cx="150.000" cy="358.000" r="5" fill="#555"/><circle id="event-maximum-height" cx="150.000" cy="50.000" r="5" fill="#174a7e"/><text id="maximum-height-label" x="168.000" y="50.000">maximum height (t = 2 s)</text><circle id="event-return-to-launch-position" cx="150.000" cy="358.000" r="5" fill="#555"/><text id="return-to-launch-position-label" x="168.000" y="376.000">return to launch position (t = 4 s)</text><circle id="event-ground-impact" cx="150.000" cy="435.000" r="5" fill="#555"/><text id="ground-impact-label" x="168.000" y="435.000">ground impact (t = 4.23607 s)</text><line id="velocity-launch" x1="195.000" y1="358.000" x2="195.000" y2="326.000" stroke="#174a7e" stroke-width="2" marker-end="url(#arrow)"/><text id="velocity-launch-label" x="208.000" y="342.000">v = 20 m/s</text><line id="velocity-return-to-launch-position" x1="195.000" y1="358.000" x2="195.000" y2="390.000" stroke="#174a7e" stroke-width="2" marker-end="url(#arrow)"/><text id="velocity-return-to-launch-position-label" x="208.000" y="374.000">v = -20 m/s</text><line id="velocity-ground-impact" x1="195.000" y1="435.000" x2="195.000" y2="467.000" stroke="#174a7e" stroke-width="2" marker-end="url(#arrow)"/><text id="velocity-ground-impact-label" x="208.000" y="451.000">v = -22.3607 m/s</text><line id="gravity-arrow" x1="270.000" y1="212.000" x2="270.000" y2="268.000" stroke="#a33" stroke-width="2" marker-end="url(#arrow)"/><text id="gravity-label" x="282.000" y="245.000">g = -10 m/s² (downward)</text><text id="sign-convention" x="60.000" y="462.000">positive direction: up</text></g></svg>