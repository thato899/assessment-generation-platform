[project]
name = "assessment-generation-platform"
version = "0.1.0"
description = "Deterministic, curriculum-aware assessment generation for South African education."
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.9,<3", "uvicorn[standard]>=0.30,<1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-cov>=5,<8", "ruff>=0.6,<1", "mypy>=1.11,<2", "httpx>=0.27,<1", "build>=1.2,<2"]

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.mypy]
strict = true
files = ["src"]
